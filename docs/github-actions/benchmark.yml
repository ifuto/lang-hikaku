name: benchmark

on:
  workflow_dispatch: # 手動実行（Actionsタブの「Run workflow」ボタンを押す）
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 言語ごとのベンチマーク実行（各言語50項目）
  # ============================================================
  run-benchmarks:
    name: 実行 ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false # 1言語が失敗しても他の言語の実行を止めない
      max-parallel: 4  # 同時実行数（ランナーは言語ごとに独立しているので計測に影響しない）
      matrix:
        lang: [c, cpp, rust, go, java, csharp, python, node, typescript, ruby, php, julia]
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python インストール
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 言語ごとのツールチェーン ----
      - name: C (GCC) インストール
        if: matrix.lang == 'c'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: C++ (G++) インストール
        if: matrix.lang == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Rust インストール
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Go インストール
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Java インストール
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: C# (.NET) インストール
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: JavaScript / TypeScript (Node.js) インストール
        if: matrix.lang == 'node' || matrix.lang == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript コンパイラ インストール
        if: matrix.lang == 'typescript'
        run: npm install -g typescript

      - name: Ruby インストール
        if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: PHP インストール
        if: matrix.lang == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Julia インストール
        if: matrix.lang == 'julia'
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      # ---- 計測 ----
      - name: ベンチマーク実行（${{ matrix.lang }}）
        run: python3 harness/run.py --lang ${{ matrix.lang }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      - name: 結果をアップロード
        if: always() # 途中で失敗しても部分結果を保存する
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.lang }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # 結果の統合とレポート生成（全言語の結果をまとめる）
  # ============================================================
  aggregate:
    name: レポート生成
    runs-on: ubuntu-latest
    needs: run-benchmarks
    if: always()
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python インストール
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 結果をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: results-*

      - name: 結果を統合
        run: python3 harness/merge_results.py results

      - name: レポート生成
        run: python3 harness/report.py --results results/results.json

      - name: レポートをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            results/report.html
            results/ranking.md
            results/times.csv
          retention-days: 14
